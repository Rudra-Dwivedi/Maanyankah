{% if request.endpoint != 'agent.index' %}
<!-- Floating AI Agent: चित्राङ्कः (Chitrankah) -->
<div id="floating-agent-container" class="floating-agent-container">
  <!-- Floating Launcher Button -->
  <button type="button" id="floating-agent-trigger" class="floating-agent-trigger" aria-label="Open चित्राङ्कः AI Movie Assistant" title="Open चित्राङ्कः (Chitrankah) AI Assistant">
    <div class="floating-trigger-avatar-wrap">
      <img src="{{ url_for('static', filename='img/chitrankakah_avatar.png') }}" alt="चित्राङ्कः" class="floating-trigger-thumb">
      <span class="floating-pulse-badge" title="Online & Ready"></span>
    </div>
    <span class="floating-trigger-label">चित्राङ्कः</span>
  </button>

  <!-- Floating Chat Window / Drawer -->
  <div id="floating-agent-window" class="floating-agent-window" role="dialog" aria-labelledby="floating-agent-title" aria-modal="true" style="display: none;">
    <!-- Header -->
    <div class="floating-header">
      <div class="floating-header-info">
        <div class="floating-header-avatar">
          <img src="{{ url_for('static', filename='img/chitrankakah_avatar.png') }}" alt="चित्राङ्कः" class="agent-character-thumb">
        </div>
        <div class="floating-header-text">
          <div class="floating-title-row">
            <h3 id="floating-agent-title" class="floating-agent-title">
              <img src="{{ url_for('static', filename='img/chitrankakah_logo.png') }}" alt="चित्राङ्कः" class="floating-brand-logo">
            </h3>
            <span class="floating-agent-badge">AI AGENT</span>
          </div>
          <span class="floating-subtitle">Cinema & Ratings Intelligence</span>
        </div>
      </div>
      <div class="floating-header-actions">
        <button type="button" id="floating-agent-reset" class="floating-btn-header-action" title="New conversation (Reset)" aria-label="New conversation">↺</button>
        <a href="{{ url_for('agent.index') }}" class="floating-btn-header-action" title="Open full-screen AI Studio" aria-label="Open full page">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
        <button type="button" id="floating-agent-close" class="floating-btn-header-action" title="Close चित्राङ्कः" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- Quick Prompt Suggestions Bar -->
    <div class="floating-chips-container">
      <button type="button" class="floating-chip" data-query="Highest rated movies on Maanyankah">🏆 Top Rated</button>
      <button type="button" class="floating-chip" data-query="Recommend a sci-fi thriller">🚀 Sci-Fi Pick</button>
      <button type="button" class="floating-chip" data-query="Tell me about Inception">🌀 Inception</button>
      <button type="button" class="floating-chip" data-query="What is the rating of The Dark Knight?">🦇 The Dark Knight</button>
      <button type="button" class="floating-chip" data-query="Tell me about Parasite">🏠 Parasite</button>
    </div>

    <!-- Messages / Stream Area -->
    <div id="floating-messages-stream" class="floating-messages-stream">
      <!-- Default welcome bubble -->
      <div class="floating-bubble bubble-agent" id="floating-welcome-bubble">
        <div class="bubble-avatar">
          <img src="{{ url_for('static', filename='img/chitrankakah_avatar.png') }}" alt="चित्राङ्कः" class="agent-character-thumb">
        </div>
        <div class="bubble-content">
          <img src="{{ url_for('static', filename='img/chitrankakah_logo.png') }}" alt="चित्राङ्कः" class="welcome-bubble-logo">
          <p class="bubble-greeting"><strong>नमस्ते! I am चित्राङ्कः (Chitrankah).</strong></p>
          <p class="bubble-text">Your intelligent cinema & ratings guide on <strong>मान्यांकः</strong>. Ask me about any movie, inspect community ratings & review quotes, or get personalized recommendations!</p>
          <div class="bubble-actions">
            <button type="button" class="floating-bubble-chip" data-query="Highest rated movies on Maanyankah">⭐ View Top Ranked Movies</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Input Bar -->
    <form id="floating-agent-form" class="floating-form">
      <div class="floating-input-wrap">
        <input type="text" id="floating-agent-input" class="floating-input" placeholder="Ask चित्राङ्कः about movies, ratings..." autocomplete="off" required>
      </div>
      <button type="submit" id="floating-send-btn" class="floating-send-btn" title="Send question" aria-label="Send">
        <span class="send-icon">➤</span>
        <span class="send-spinner" style="display: none;">⏳</span>
      </button>
    </form>
  </div>
</div>

<script>
(function() {
  const container = document.getElementById('floating-agent-container');
  const triggerBtn = document.getElementById('floating-agent-trigger');
  const win = document.getElementById('floating-agent-window');
  const closeBtn = document.getElementById('floating-agent-close');
  const resetBtn = document.getElementById('floating-agent-reset');
  const form = document.getElementById('floating-agent-form');
  const input = document.getElementById('floating-agent-input');
  const stream = document.getElementById('floating-messages-stream');
  const sendBtn = document.getElementById('floating-send-btn');
  const sendIcon = sendBtn ? sendBtn.querySelector('.send-icon') : null;
  const sendSpinner = sendBtn ? sendBtn.querySelector('.send-spinner') : null;

  function scrollToBottom() {
    if (stream) {
      stream.scrollTop = stream.scrollHeight;
    }
  }

  function openWindow() {
    if (win) {
      win.style.display = 'flex';
      win.classList.add('floating-window-active');
      triggerBtn.classList.add('floating-trigger-active');
      setTimeout(function() {
        if (input) input.focus();
        scrollToBottom();
      }, 50);
    }
  }

  function closeWindow() {
    if (win) {
      win.style.display = 'none';
      win.classList.remove('floating-window-active');
      triggerBtn.classList.remove('floating-trigger-active');
    }
  }

  function toggleWindow() {
    if (!win) return;
    if (win.style.display === 'none' || !win.classList.contains('floating-window-active')) {
      openWindow();
    } else {
      closeWindow();
    }
  }

  if (triggerBtn) {
    triggerBtn.addEventListener('click', toggleWindow);
  }
  if (closeBtn) {
    closeBtn.addEventListener('click', closeWindow);
  }

  // Reset conversation
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      if (stream) {
        stream.innerHTML = `
          <div class="floating-bubble bubble-agent" id="floating-welcome-bubble">
            <div class="bubble-avatar"><img src="/static/img/chitrankakah_avatar.png" alt="चित्राङ्कः" class="agent-character-thumb"></div>
            <div class="bubble-content">
              <img src="/static/img/chitrankakah_logo.png" alt="चित्राङ्कः" class="welcome-bubble-logo">
              <p class="bubble-greeting"><strong>नमस्ते! I am चित्राङ्कः (Chitrankah).</strong></p>
              <p class="bubble-text">Your intelligent cinema & ratings guide on <strong>मान्यांकः</strong>. Ask me about any movie, inspect community ratings & review quotes, or get personalized recommendations!</p>
              <div class="bubble-actions">
                <button type="button" class="floating-bubble-chip" data-query="Highest rated movies on Maanyankah">⭐ View Top Ranked Movies</button>
              </div>
            </div>
          </div>
        `;
        if (input) {
          input.value = '';
          input.focus();
        }
      }
    });
  }

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && win && win.classList.contains('floating-window-active')) {
      closeWindow();
    }
  });

  // Global helper for opening Chitrankah from any movie card / link
  window.openChitrankah = window.openChitrankakah = function(query) {
    openWindow();
    if (query && typeof query === 'string') {
      const q = query.trim();
      if (q) {
        let finalQ = q;
        if (!q.toLowerCase().startsWith('tell me about') && !q.toLowerCase().startsWith('what') && !q.toLowerCase().startsWith('recommend')) {
          finalQ = 'Tell me about ' + q;
        }
        if (input) input.value = finalQ;
        submitFloatingQuery(finalQ);
      }
    }
  };

  function appendUserBubble(text) {
    const bubble = document.createElement('div');
    bubble.className = 'floating-bubble bubble-user';
    bubble.innerHTML = `<div class="bubble-content"><p class="bubble-text">${escapeHtml(text)}</p></div>`;
    stream.appendChild(bubble);
    scrollToBottom();
  }

  function appendLoadingBubble() {
    const bubble = document.createElement('div');
    bubble.className = 'floating-bubble bubble-agent bubble-loading';
    bubble.id = 'floating-loading-bubble';
    bubble.innerHTML = `
      <div class="bubble-avatar"><img src="/static/img/chitrankakah_avatar.png" alt="चित्राङ्कः" class="agent-character-thumb"></div>
      <div class="bubble-content">
        <div class="agent-typing-indicator">
          <span></span><span></span><span></span>
        </div>
        <small class="typing-note">चित्राङ्कः is analyzing ratings...</small>
      </div>
    `;
    stream.appendChild(bubble);
    scrollToBottom();
  }

  function removeLoadingBubble() {
    const loader = document.getElementById('floating-loading-bubble');
    if (loader) loader.remove();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderMovieDetailHtml(m) {
    const s = m.stats;
    let breakdownRows = '';
    [5, 4, 3, 2, 1].forEach(function(star) {
      const b = s.breakdown[star] || { pct: 0, count: 0 };
      breakdownRows += `
        <div class="float-breakdown-row">
          <span class="float-star-lbl">${star}★</span>
          <div class="float-bar-track">
            <div class="float-bar-fill" style="width: ${b.pct}%;"></div>
          </div>
          <span class="float-pct-lbl">${b.pct}%</span>
        </div>
      `;
    });

    let quotesSnippet = '';
    if (s.posts && s.posts.length > 0) {
      quotesSnippet = `
        <div class="float-quotes-box">
          <div class="float-quotes-title">💬 Member Reviews:</div>
          ${s.posts.slice(0, 2).map(p => `
            <div class="float-quote-item">
              <strong>@${escapeHtml(p.username)}:</strong> "${escapeHtml(p.content)}"
            </div>
          `).join('')}
        </div>
      `;
    }

    const posterHtml = m.image_url 
      ? `<img src="${m.image_url}" alt="${escapeHtml(m.title)}" class="float-movie-thumb">`
      : `<div class="float-thumb-placeholder">🎬</div>`;

    const genresHtml = (m.genres || []).map(g => `<span class="float-genre-tag">${escapeHtml(g)}</span>`).join('');

    return `
      <div class="float-movie-card">
        <div class="float-movie-top">
          ${posterHtml}
          <div class="float-movie-main">
            <h4 class="float-movie-title">${escapeHtml(m.title)} <span class="float-year">(${m.year})</span></h4>
            <div class="float-director">Dir: <strong>${escapeHtml(m.director)}</strong></div>
            <div class="float-score-pill" title="Community Average on Maanyankah">
              <span class="star-gold">★</span> <strong>${s.avg_rating}</strong> <small>/ 5 (${s.rating_count} ${s.rating_count === 1 ? 'rating' : 'ratings'})</small>
            </div>
            <div class="float-genres">${genresHtml}</div>
          </div>
        </div>

        <p class="float-synopsis">${escapeHtml(m.synopsis)}</p>

        <div class="float-analytics">
          <div class="float-sentiment-summary">${escapeHtml(s.sentiment_summary)}</div>
          <div class="float-breakdown-list">
            ${breakdownRows}
          </div>
          ${quotesSnippet}
        </div>

        <div class="float-card-actions">
          <button type="button" class="float-action-btn" data-query="Recommend movies similar to ${escapeHtml(m.title)}">🎬 Similar Movies</button>
          <button type="button" class="float-action-btn" data-query="Why did people rate ${escapeHtml(m.title)} high?">⭐ Consensus</button>
        </div>
      </div>
    `;
  }

  function renderMiniGridHtml(title, message, movies) {
    const listHtml = (movies || []).map(rm => `
      <div class="float-mini-item">
        ${rm.image_url ? `<img src="${rm.image_url}" alt="${escapeHtml(rm.title)}" class="float-mini-thumb">` : `<div class="float-mini-icon">🎬</div>`}
        <div class="float-mini-details">
          <strong class="float-mini-title">${escapeHtml(rm.title)}</strong>
          <div class="float-mini-score"><span class="star-gold">★</span> ${rm.avg_rating} <small>(${rm.rating_count} ratings)</small></div>
        </div>
        <button type="button" class="float-btn-ask-item" data-q="Tell me about ${escapeHtml(rm.title)}">Deep Dive</button>
      </div>
    `).join('');

    return `
      <div class="float-ranking-card">
        <h4 class="float-ranking-title">${escapeHtml(title)}</h4>
        <p class="float-ranking-msg">${escapeHtml(message)}</p>
        <div class="float-mini-list">
          ${listHtml}
        </div>
      </div>
    `;
  }

  function appendAgentBubble(data) {
    let bodyHtml = '';
    if (data.type === 'movie_detail') {
      bodyHtml = renderMovieDetailHtml(data.movie);
    } else if (data.type === 'ranking' || data.type === 'recommendations') {
      bodyHtml = renderMiniGridHtml(data.title, data.message, data.movies || []);
    } else {
      bodyHtml = `
        <div class="float-general-card">
          <h4 class="float-general-title">${escapeHtml(data.title || 'चित्राङ्कः')}</h4>
          <p class="float-general-msg">${escapeHtml(data.message)}</p>
        </div>
      `;
    }

    // Follow up chips
    let suggestionsHtml = '';
    if (data.suggestions && data.suggestions.length > 0) {
      suggestionsHtml = `
        <div class="float-suggestion-chips">
          <span class="float-suggestions-label">Suggestions:</span>
          ${data.suggestions.map(s => `<button type="button" class="floating-chip floating-chip-sm" data-query="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
        </div>
      `;
    }

    const bubble = document.createElement('div');
    bubble.className = 'floating-bubble bubble-agent';
    bubble.innerHTML = `
      <div class="bubble-avatar"><img src="/static/img/chitrankakah_avatar.png" alt="चित्राङ्कः" class="agent-character-thumb"></div>
      <div class="bubble-content">
        ${bodyHtml}
        ${suggestionsHtml}
      </div>
    `;
    stream.appendChild(bubble);
    scrollToBottom();

    // Attach listeners to any new prompt chips or action buttons
    bubble.querySelectorAll('.floating-chip, .float-btn-ask-item, .float-action-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const q = this.getAttribute('data-query') || this.getAttribute('data-q');
        if (q) {
          if (input) input.value = q;
          submitFloatingQuery(q);
        }
      });
    });
  }

  function submitFloatingQuery(query) {
    const q = (query || '').trim();
    if (!q) return;

    appendUserBubble(q);
    if (input) input.value = '';

    if (sendIcon) sendIcon.style.display = 'none';
    if (sendSpinner) sendSpinner.style.display = 'inline';
    if (sendBtn) sendBtn.disabled = true;

    appendLoadingBubble();

    fetch('/agent/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q })
    })
    .then(res => res.json())
    .then(data => {
      removeLoadingBubble();
      if (sendIcon) sendIcon.style.display = 'inline';
      if (sendSpinner) sendSpinner.style.display = 'none';
      if (sendBtn) sendBtn.disabled = false;
      appendAgentBubble(data);
    })
    .catch(err => {
      removeLoadingBubble();
      if (sendIcon) sendIcon.style.display = 'inline';
      if (sendSpinner) sendSpinner.style.display = 'none';
      if (sendBtn) sendBtn.disabled = false;
      const errorBubble = document.createElement('div');
      errorBubble.className = 'floating-bubble bubble-agent';
      errorBubble.innerHTML = `
        <div class="bubble-avatar">⚠️</div>
        <div class="bubble-content">
          <p class="text-danger">Could not reach चित्राङ्कः: ${escapeHtml(err.message)}</p>
        </div>
      `;
      stream.appendChild(errorBubble);
      scrollToBottom();
    });
  }

  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (input && input.value) {
        submitFloatingQuery(input.value);
      }
    });
  }

  // Global event delegation for chips inside container
  if (container) {
    container.addEventListener('click', function(e) {
      const chip = e.target.closest('.floating-chip, .floating-bubble-chip, .float-action-btn');
      if (chip) {
        const q = chip.getAttribute('data-query');
        if (q) {
          if (input) input.value = q;
          submitFloatingQuery(q);
        }
      }
    });
  }

})();
</script>
{% endif %}
